[workspace]
members = [
    "crates/creative-project-schema",
    "crates/asset-pipeline",
    "crates/packer",
    "crates/rule-checker",
    "crates/playable-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
